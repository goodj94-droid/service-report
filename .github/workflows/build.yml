name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project
        run: unzip -o project.zip -d build-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ambil jsPDF
        run: curl -fL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o build-src/app/src/main/assets/jspdf.umd.min.js

      - name: Build APK
        working-directory: build-src
        run: gradle assembleRelease --no-daemon

      - name: Beri nama APK
        run: cp build-src/app/build/outputs/apk/release/app-release.apk ServiceReport-v${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Service Report v${{ github.run_number }}
          files: ServiceReport-v${{ github.run_number }}.apk
